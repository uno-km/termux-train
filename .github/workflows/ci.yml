name: termux-train Multi-Platform CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - '**.md'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies & Editable Package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Run CLI Environment Diagnostics
        run: |
          python -m termux_train.cli info
          python -m termux_train.cli check

      - name: Run 0-Point Baseline Granular Audit Scoring
        run: |
          python scripts/run_audit_scoring.py

      - name: Run Full Unit & Integration Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Execute Canonical Example Demos (01 ~ 08)
        run: |
          python examples/01_tensor_basics.py
          python examples/02_nn_forward_backward.py
          python examples/03_matmul_1d_to_3d.py
          python examples/04_xor_training.py
          python examples/05_mobile_training_runtime.py
          python examples/06_lora_adapter_training.py
          python examples/07_transformer_lm.py
          python examples/08_docfold_trainer.py

  package:
    name: Build & Verify PyPI Distribution Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: Verify Package Metadata with Twine
        run: |
          twine check dist/*
