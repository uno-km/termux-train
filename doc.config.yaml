training_guide_body: |
  <h3>Multimodal On-Device Training Pipeline Manual</h3>
  <p>Termux-Train operates through a deterministic 4-stage pipeline designed to protect mobile system integrity while maximizing mathematical convergence.</p>

  <h4>Stage 1: Zero-Leak Data Ingestion &amp; Persistent Feature Caching</h4>
  <p>To avoid repeated CPU/GPU bottlenecks across epochs, compute-intensive preprocessing operations are cached deterministically on disk using SHA-256 hashes as keys:</p>
  <ul>
    <li><strong>Diffusion VAE Latents</strong>: Source images are passed through the VAE encoder once; latent representations ($C \times \frac{H}{8} \times \frac{W}{8}$) are stored in <code>.cache/latents/&lt;sha256&gt;.safetensors</code>.</li>
    <li><strong>Audio Mel Filterbanks</strong>: Raw waveforms are transformed into 80-channel log-Mel spectrograms and cached on disk.</li>
  </ul>

  <h4>Stage 2: DAG Autograd Forward-Backward Dispatch</h4>
  <p>The pure Python/C DAG Autograd dynamically constructs computational graphs. Tensors maintain backward gradient closure functions without heap allocation overheads.</p>

  <h4>Stage 3: 300MB Guard-Band Memory Protection</h4>
  <p>During every forward-backward iteration, the runtime queries <code>/proc/meminfo</code> via native Bionic syscalls. If available physical RAM drops below 300MB, the engine immediately suspends batch ingestion, triggers garbage collection, and pages layer weights to prevent Android LMK termination.</p>

  <h4>Stage 4: Target-Aware SafeTensors Serialization</h4>
  <p>Weights are serialized into industry-standard SafeTensors files with explicit little-endian byte ordering. A companion <code>_config.json</code> sidecar is automatically generated to enable zero-configuration import into downstream inference engines.</p>

advanced_parameters_body: |
  <h3>Hardware Tuning &amp; GPU Slicing Flags</h3>
  <p>Granular parameters to fine-tune execution on Qualcomm Adreno and ARM Mali GPUs:</p>

  <table class="data-table">
    <thead>
      <tr>
        <th>Flag</th>
        <th>Type</th>
        <th>Default</th>
        <th>Recommendation</th>
        <th>Architectural Function</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><code>--vocab-slice</code></td>
        <td>Integer</td>
        <td><code>0</code> (disabled)</td>
        <td><code>4096</code> on Mali, <code>8192</code> on Adreno</td>
        <td>Partitions the final vocabulary projection matrix into sequential slices, avoiding large temporary logit tensor allocations.</td>
      </tr>
      <tr>
        <td><code>--chunk-layers</code></td>
        <td>Integer</td>
        <td><code>0</code> (disabled)</td>
        <td><code>2</code> on Mali, <code>4</code> on Adreno</td>
        <td>Dispatches $N$ transformer layers per command buffer, relinquishing GPU execution context to reset mobile OS watchdog timers.</td>
      </tr>
      <tr>
        <td><code>--stream-layers</code></td>
        <td>Boolean</td>
        <td><code>false</code></td>
        <td>Enabled on &le;8GB devices</td>
        <td>Streams inactive layer weights from host RAM to GPU VRAM buffers on demand, keeping GPU resident memory minimal.</td>
      </tr>
      <tr>
        <td><code>--guard-band</code></td>
        <td>Integer (MB)</td>
        <td><code>300</code></td>
        <td><code>300</code> - <code>500</code></td>
        <td>System RAM threshold preserved at all times against Android Low Memory Killer (LMK).</td>
      </tr>
      <tr>
        <td><code>--virtual-ram-pool</code></td>
        <td>String</td>
        <td><code>""</code></td>
        <td>Fleet node IP list</td>
        <td>Aggregates physical RAM across mobile devices into a unified 44GB virtual memory pool.</td>
      </tr>
    </tbody>
  </table>

api_body: |
  <h3>Programmatic Python &amp; Node.js API Reference</h3>

  <h4>Python Module <code>termux_train</code></h4>
  <table class="data-table">
    <thead>
      <tr><th>Function / Class</th><th>Signature</th><th>Description</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><code>tt.diffusion.train_diffusion_lora</code></td>
