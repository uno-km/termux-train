# doc.config.yaml - Termux-Train Master Unified Single Source of Truth (SSOT)
name: "Termux-Train"
lib_slug: "train"
package_name_pypi: "termux-train"
package_name_npm: "termux-train"
version: "v2.0.1"
release_name: "Unified Multimodal On-Device Deep Learning & AMEVA Cluster Virtual RAM Pooling Engine"
license: "Apache-2.0"
platform: "Android ARM64 / Linux / Termux"
github_repo_url: "https://github.com/uno-km/termux-train"

tagline_en: "Unified Multimodal On-Device Deep Learning & LoRA Training Framework for Android Termux with 6-Modality Adapters (LLM, Diffusion, VLM, STT, TTS, BitNet), GPU Slicing, and 44GB Disaggregated Cluster Virtual RAM Pooling"
tagline_ko: "디바이스 리소스를 활용한 안드로이드 Termux 6대 모달리티(LLM, Diffusion, VLM, STT, TTS, BitNet) 온디바이스 LoRA/DoRA 학습, 단일 기기 GPU 슬라이싱 및 44GB 가상 메모리 풀링 프레임워크"

quick_install_cmd: |
  pip install termux-train
  # or via npm:
  npm install -g termux-train
  # or standalone bootstrap:
  bash <(curl -sSL https://raw.githubusercontent.com/uno-km/termux-train/main/install.sh)

why_challenge_en: "Standard deep learning training systems (PyTorch, DeepSpeed, Megatron) require multi-gigabyte build toolchains unavailable on Android Bionic, lack native mobile GPU autograd dispatch, and rapidly trigger the Android Low Memory Killer (LMK) during backward activation accumulation."
why_challenge_ko: "기존 딥러닝 학습 시스템(PyTorch, DeepSpeed 등)은 안드로이드 Bionic 환경에서 빌드가 불가능하고 모바일 GPU 역전파 디스패치를 지원하지 않으며, 역전파 활성화 텐서 누적으로 인해 안드로이드 LMK(Low Memory Killer) 강제 종료를 유발했습니다."

description_en: "Termux-Train v2.0.1 delivers a dependency-free C-vectorized DAG Autograd engine, 6-Modality target-aware LoRA/DoRA training (LLM, Image Diffusion, Vision VLM, Whisper STT, TTS, BitNet 1.58-bit), Mali/Adreno GPU Slicing, 300MB Guard-Band memory protection, and 44GB disaggregated AMEVA Cluster virtual RAM pooling across heterogeneous mobile fleets."
description_ko: "Termux-Train v2.0.1은 무의존성 C-벡터화 DAG 자동미분(Autograd) 엔진, 6대 모달리티 타깃 어댑터 허브(LLM, 이미지 확산, 비전 VLM, Whisper STT, TTS, BitNet 1.58비트), Mali/Adreno GPU 슬라이싱, 300MB 까치밥 메모리 보존, 그리고 이기종 스마트폰 군을 단일 메모리로 묶는 44GB 분산 AMEVA Cluster 가상 메모리 풀링 파이프라인 학습을 완벽하게 제공합니다."

installation_body: |
  <div class="alert alert-tip">
    <span class="alert-title">Hardware &amp; System Prerequisites</span>
    <p>Targeted for ARM64 Android Termux environments (Android 10+, kernel 4.19+ / 5.x / 6.x), Snapdragon 8 series, Exynos, Dimensity, or generic Linux aarch64. Requires Python 3.9+ or Node.js 18+.</p>
  </div>

  <h3>Package Managers</h3>
  <div class="code-tab-group">
    <div class="code-tabs-header">
      <button class="code-tab-btn active" type="button">Python (pip)</button>
      <button class="code-tab-btn" type="button">Node.js (npm)</button>
      <button class="code-tab-btn" type="button">Standalone Shell</button>
    </div>
    <div class="code-tab-content" style="display:block;">
      <pre><code># Install official wheel from PyPI
  pip install --upgrade termux-train</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># Install global CLI and client library from npm
  npm install -g termux-train</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># Zero-configuration bootstrap installer
  curl -sSL https://raw.githubusercontent.com/uno-km/termux-train/main/install.sh | bash</code></pre>
    </div>
  </div>

  <h3>Vulkan Hardware Acceleration Configuration</h3>
  <p>To enable Vulkan compute acceleration on Android Termux:</p>
  <pre><code># Install Vulkan utilities and headers
  pkg update && pkg install -y vulkan-tools mesa-vulkan-icd-freedreno

  # Validate Vulkan hardware compute capabilities
  vulkaninfo --summary

  # Verify Termux-Train backend detection
  termux-train info</code></pre>

quickstart_body: |
  <h3>6-Modality Rapid Execution Recipes</h3>
  <p>Select your target modality to view canonical CLI and SDK execution patterns:</p>

  <div class="code-tab-group">
    <div class="code-tabs-header">
      <button class="code-tab-btn active" type="button">Diffusion LoRA</button>
      <button class="code-tab-btn" type="button">Vision VLM</button>
      <button class="code-tab-btn" type="button">Whisper STT</button>
      <button class="code-tab-btn" type="button">Speech TTS</button>
      <button class="code-tab-btn" type="button">LLM / DoRA</button>
      <button class="code-tab-btn" type="button">Cluster Virtual RAM</button>
    </div>
    <div class="code-tab-content" style="display:block;">
      <pre><code># CLI Execution
  termux-train diffusion-train --image-dir ./images --prompt "product photo" --output ./adapter.safetensors --epochs 5 --backend vulkan

  # Python SDK
  import termux_train as tt
  tt.diffusion.train_diffusion_lora(image_dir="./images", output_path="./adapter.safetensors", epochs=5, backend="vulkan")</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># CLI Execution
  termux-train vision-train --data ./vlm.jsonl --output ./vlm_adapter.safetensors --epochs 3 --backend vulkan

  # Node.js SDK
  import { trainVision } from 'termux-train';
  await trainVision({ data: './vlm.jsonl', output: './vlm_adapter.safetensors', epochs: 3, backend: 'vulkan' });</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># CLI Execution
  termux-train stt-train --data ./audio.jsonl --output ./stt_adapter.safetensors --epochs 4 --backend vulkan

  # Python SDK
  import termux_train as tt
  tt.stt.train_stt_lora(data_source="./audio.jsonl", output_path="./stt_adapter.safetensors", epochs=4, backend="vulkan")</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># CLI Execution
  termux-train tts-train --data ./voice.jsonl --output ./tts_adapter.safetensors --epochs 5 --backend cpu

  # Node.js SDK
  import { trainTTS } from 'termux-train';
  await trainTTS({ data: './voice.jsonl', output: './tts_adapter.safetensors', epochs: 5, backend: 'cpu' });</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># CLI with GPU Slicing
  termux-train train --model tiny-transformer --data ./corpus.txt --vocab-slice 4096 --chunk-layers 2 --stream-layers --backend vulkan

  # Python SDK
  from termux_train import TermuxTrainer
  trainer = TermuxTrainer(model_type="lora", lora_rank=8, vocab_slice=4096, chunk_layers=2, backend="vulkan")
  trainer.fit(data_path="./corpus.txt", epochs=3, output_path="./llm_adapter.safetensors")</code></pre>
    </div>
    <div class="code-tab-content" style="display:none;">
      <pre><code># Fleet Worker Node (e.g. S21, S20)
  termux-train cluster-worker --port 50052 --guard-band 300

  # Coordinator Node (e.g. S25)
  termux-train cluster-probe --fleet 192.168.1.101:50052,192.168.1.102:50052
  termux-train train --data ./large.txt --virtual-ram-pool 192.168.1.101:50052,192.168.1.102:50052</code></pre>
    </div>
  </div>

