      <tr>
        <td><code>tt.vision.train_vision_vlm_lora</code></td>
        <td><code>(data_source, output_path, epochs=3, lr=2e-4, rank=8, backend="auto")</code></td>
        <td>Trains vision multimodal projection adapter and exports termux-vision SafeTensors.</td>
      </tr>
      <tr>
        <td><code>tt.stt.train_stt_lora</code></td>
        <td><code>(data_source, output_path, epochs=3, lr=5e-4, rank=4, backend="auto")</code></td>
        <td>Fine-tunes Whisper acoustic encoder-decoder attention blocks.</td>
      </tr>
      <tr>
        <td><code>tt.tts.train_tts_lora</code></td>
        <td><code>(data_source, output_path, epochs=3, lr=3e-4, rank=4, backend="auto")</code></td>
        <td>Fine-tunes neural speech synthesis speaker style parameters.</td>
      </tr>
      <tr>
        <td><code>tt.TermuxTrainer</code></td>
        <td><code>(model_type="lora", lora_rank=8, vocab_slice=0, chunk_layers=0, backend="auto")</code></td>
        <td>Master configurable trainer for LLMs, tiny transformers, and DoRA adapters.</td>
      </tr>
    </tbody>
  </table>

  <h4>Node.js / TypeScript Module <code>termux-train</code></h4>
  <pre><code>import { trainDiffusion, trainVision, trainSTT, trainTTS, runClusterProbe, TermuxTrainer } from 'termux-train';</code></pre>

