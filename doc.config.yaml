readme_pypi_content: |
  # Termux-Train (Python)

  [![PyPI](https://img.shields.io/pypi/v/termux-train.svg?style=flat-square&color=0369a1)](https://pypi.org/project/termux-train/)
  [![Python](https://img.shields.io/pypi/pyversions/termux-train.svg?style=flat-square)](https://pypi.org/project/termux-train/)
  [![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-train)

  > Unified Multimodal On-Device Deep Learning & LoRA Training Framework for Android Termux with 6-Modality Adapters (LLM, Diffusion, VLM, STT, TTS, BitNet), GPU Slicing, and 44GB Disaggregated Cluster Virtual RAM Pooling.

  ## Installation

  ```bash
  pip install termux-train

  # For multi-device distributed 44GB Virtual RAM Pooling (Required):
  pip install ameva-cluster
  ```

  ## Python Quickstart

  ```python
  import termux_train as tt

  # 1. Diffusion LoRA Training
  tt.diffusion.train_diffusion_lora(
      image_dir="./training_images",
      output_path="./adapter_diffusion.safetensors",
      prompt="industrial technical illustration",
      resolution=512,
      epochs=5,
      lr=0.0001,
      rank=8,
      backend="vulkan"
  )

  # 2. Vision VLM LoRA Training
  tt.vision.train_vision_vlm_lora(
      data_source="./vlm_dataset.jsonl",
      output_path="./adapter_vision.safetensors",
      epochs=3,
      backend="vulkan"
  )
  ```

  ## AMEVA Cluster Multi-Device Virtual RAM Manual
  To train models exceeding single-device physical memory across multiple Android smartphones:
  ```bash
  # Step 1: Run worker on contributor phones (e.g. S21, S20, A53)
  ameva-cluster worker --port 50052 --guard-band 300

  # Step 2: Probe fleet from coordinator phone (e.g. S25)
  termux-train cluster-probe --fleet 192.168.1.101:50052,192.168.1.102:50052

  # Step 3: Run distributed pipeline training on aggregated 44GB virtual RAM pool
  termux-train train --model tiny-transformer --data ./corpus.txt \
    --virtual-ram-pool 192.168.1.101:50052,192.168.1.102:50052 \
    --vocab-slice 4096 --chunk-layers 2 --backend vulkan
  ```

  ## CLI Usage

  ```bash
  # Diffusion LoRA
  termux-train diffusion-train --image-dir ./images --output ./adapter.safetensors --epochs 5

  # Vision VLM LoRA
  termux-train vision-train --data ./vlm.jsonl --output ./vlm_adapter.safetensors --epochs 3

  # Whisper STT LoRA
  termux-train stt-train --data ./audio.jsonl --output ./stt_adapter.safetensors --epochs 4

  # TTS Style LoRA
  termux-train tts-train --data ./speech.jsonl --output ./tts_adapter.safetensors --epochs 5

  # LLM LoRA with GPU Slicing
  termux-train train --model tiny-transformer --data ./corpus.txt --vocab-slice 4096 --chunk-layers 2
  ```

  ## Documentation & Repository
  - Official Documentation: https://uno-km.vercel.app/lib/train/
  - GitHub Repository: https://github.com/uno-km/termux-train

  ## License
  Apache-2.0 License. Copyright (c) 2026 Eunho Kim (@uno-km).

readme_npm_content: |
  # Termux-Train (Node.js & TypeScript)

  [![npm](https://img.shields.io/npm/v/termux-train.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/termux-train)
  [![npm downloads](https://img.shields.io/npm/dm/termux-train.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/termux-train)
  [![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-train)

  > Unified Multimodal On-Device Deep Learning & LoRA Training Framework for Android Termux with 6-Modality Adapters (LLM, Diffusion, VLM, STT, TTS, BitNet), GPU Slicing, and 44GB Disaggregated Cluster Virtual RAM Pooling.

  ## Installation

  ```bash
  npm install termux-train
  # or global CLI installation:
  npm install -g termux-train

  # For multi-device distributed 44GB Virtual RAM Pooling (Required):
  npm install -g @ameva/cluster
  ```

  ## Node.js Quickstart

  ```typescript
  import { trainDiffusion, trainVision, trainSTT, TermuxTrainer } from 'termux-train';

  // 1. Asynchronous Diffusion LoRA Training
  await trainDiffusion({
    imageDir: './training_images',
    output: './adapter_diffusion.safetensors',
    prompt: 'clean engineering diagram',
    resolution: 512,
    epochs: 5,
    backend: 'vulkan'
  });

  // 2. High-Performance LLM LoRA Training with GPU Slicing
  const trainer = new TermuxTrainer({
    modelType: 'lora',
    loraRank: 8,
    backend: 'vulkan',
    vocabSlice: 4096,
    chunkLayers: 2
  });
  await trainer.fit({ epochs: 3, lr: 0.0002 });
  ```

  ## AMEVA Cluster Multi-Device Virtual RAM Manual
  ```bash
  # Step 1: Start memory worker daemon on contributor nodes
  ameva-cluster worker --port 50052 --guard-band 300

  # Step 2: Probe fleet memory topology from coordinator
  termux-train cluster-probe --fleet 192.168.1.101:50052,192.168.1.102:50052

  # Step 3: Run pipeline training bound to aggregated Virtual RAM pool
  termux-train train --model tiny-transformer --data ./corpus.txt \
    --virtual-ram-pool 192.168.1.101:50052,192.168.1.102:50052 \
    --vocab-slice 4096 --chunk-layers 2 --backend vulkan
  ```

  ## Global CLI Commands
  `termux-train` provides 100% flag symmetry with the Python CLI:
  ```bash
  termux-train diffusion-train --image-dir ./images --output ./adapter.safetensors --epochs 5
  termux-train vision-train --data ./vlm.jsonl --output ./vlm_adapter.safetensors --epochs 3
  termux-train stt-train --data ./audio.jsonl --output ./stt_adapter.safetensors --epochs 4
  termux-train tts-train --data ./speech.jsonl --output ./tts_adapter.safetensors --epochs 5
  termux-train cluster-worker --port 50052 --guard-band 300
  ```

  ## Documentation & Repository
  - Official Documentation: https://uno-km.vercel.app/lib/train/
  - GitHub Repository: https://github.com/uno-km/termux-train

  ## License
  Apache-2.0 License. Copyright (c) 2026 Eunho Kim (@uno-km).

changelog:
  - version: "v2.0.1"
    date: "2026-10-04"
    title: "Official AMEVA Cluster Virtual RAM Integration & Standalone Manual"
    type: "Production Stable Release"
    changes:
      - "Enforced explicit AMEVA Cluster (pip install ameva-cluster) control plane requirement for multi-device distributed memory pooling."
      - "Published complete step-by-step AMEVA Cluster deployment and 44GB virtual RAM execution manual."
      - "Integrated MasterTunnel cryptographic loopback security for inter-device tensor pipelines."
      - "Added cluster-virtual-ram documentation portal page with full Zero-Drift compliance."
      - "Bumped production package version to 2.0.1 across PyPI and npm registries."
  - version: "v2.0.0"
    date: "2026-10-03"
    title: "Major Multimodal Engine & 44GB Disaggregated Cluster Virtual RAM Release"
    type: "Production Major Release"
    changes:
      - "Added 6-Modality Target-Aware LoRA Training Hub (LLM, Diffusion, Vision VLM, Whisper STT, TTS, BitNet 1.58-bit)."
      - "Introduced Single-Device GPU Slicing Architecture (--vocab-slice, --chunk-layers, --stream-layers) preventing mobile watchdog timeouts."
      - "Implemented 44GB Disaggregated Cluster Virtual RAM Pooling across heterogeneous mobile devices with 300MB Guard-Band protection."
      - "Integrated client-side On-Device Reinforcement Learning (GRPO, DPO, PPO)."
      - "Delivered 100% Dual-Engine Parity across Python CLI, Node.js CLI, Python SDK, and Node.js SDK."
      - "Zero-conversion SafeTensors adapter export directly consumable by ComfyUI, llama.cpp, termux-vision, termux-stt, termux-tts, and bitnet.cpp."
