[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-train"
version = "0.1.0-alpha"
description = "Native On-Device Deep Learning & LoRA Training Framework for Android Termux"
readme = "README.md"
authors = [{ name = "AMEVA Team", email = "zhfldk014745@naver.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "termux",
    "android",
    "autograd",
    "deep-learning",
    "on-device-training",
    "lora",
    "transformer",
    "safetensors",
    "quantization",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
accelerated = ["numpy>=1.20.0"]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]
dev = [
    "numpy>=1.20.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "numpy>=1.20.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
termux-train = "termux_train.cli:main"

[project.urls]
Homepage = "https://github.com/uno-km/termux-train"
Documentation = "https://github.com/uno-km/termux-train#readme"
Repository = "https://github.com/uno-km/termux-train"
Issues = "https://github.com/uno-km/termux-train/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["termux_train*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "unit: Unit tests for isolated mathematical functions and classes",
    "integration: Multi-module integration and end-to-end training loops",
    "mobile: Mobile-first memory safety, streaming, and checkpointing tests",
    "benchmark: Performance, latency, and throughput verification tests",
    "scoring: 0-point baseline granular audit scorecards",
]
filterwarnings = [
    "ignore::RuntimeWarning",
]
